steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'deploy/gcp/Dockerfile', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/supershaker/supershaker:$COMMIT_SHA', '.']


  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/supershaker/supershaker:$COMMIT_SHA']


  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'supershaker'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/supershaker/supershaker:$COMMIT_SHA'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1024Mi'

options:
  logging: CLOUD_LOGGING_ONLY